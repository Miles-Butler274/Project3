<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction Market Chatbot</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="/chat/">Polymarket RAG Chatbot</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/ingestion/">Ingestion Dashboard</a>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-10 col-xl-9">
                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-body p-4">
                        <h1 class="h3 mb-2">Ask about prediction markets</h1>
                        <p class="text-muted mb-4">
                            Grounded answers using ingested Polymarket data and uploaded text sources.
                        </p>

                        <div class="input-group input-group-lg mb-3">
                            <input
                                id="q"
                                class="form-control"
                                placeholder="Example: What sports markets look most interesting right now?"
                                onkeydown="if (event.key === 'Enter') send();"
                            >
                            <button class="btn btn-primary px-4" onclick="send()">Ask</button>
                        </div>

                        <div class="d-flex gap-2 flex-wrap">
                            <button class="btn btn-outline-secondary btn-sm" onclick="setExample('What sports markets look interesting right now?')">
                                Sports
                            </button>
                            <button class="btn btn-outline-secondary btn-sm" onclick="setExample('What crypto markets seem most active and why?')">
                                Crypto
                            </button>
                            <button class="btn btn-outline-secondary btn-sm" onclick="setExample('What should I watch in political markets?')">
                                Politics
                            </button>
                        </div>
                    </div>
                </div>

                <div id="loading" class="alert alert-info d-none shadow-sm">
                    Thinking and retrieving sources...
                </div>

                <div id="resultCard" class="card shadow-sm border-0 d-none">
                    <div class="card-body p-4">
                        <h2 class="h4 mb-3">Answer</h2>
                        <p id="answer" class="mb-4"></p>

                        <div class="mb-4">
                            <h3 class="h5">Key insights</h3>
                            <ul id="insights" class="list-group list-group-flush"></ul>
                        </div>

                        <div class="mb-4">
                            <h3 class="h5">Tips</h3>
                            <ul id="tips" class="list-group list-group-flush"></ul>
                        </div>

                        <div class="mb-4">
                            <h3 class="h5">Limitations</h3>
                            <ul id="limitations" class="list-group list-group-flush"></ul>
                        </div>

                        <div>
                            <h3 class="h5">Sources</h3>
                            <ul id="sources" class="list-group"></ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        function setExample(text) {
            document.getElementById("q").value = text;
        }

        function renderList(listId, items, emptyText, linkify = false) {
            const list = document.getElementById(listId);
            list.innerHTML = "";

            if (!items || items.length === 0) {
                const li = document.createElement("li");
                li.className = "list-group-item text-muted";
                li.innerText = emptyText;
                list.appendChild(li);
                return;
            }

            items.forEach((item) => {
                const li = document.createElement("li");
                li.className = "list-group-item";

                if (linkify && typeof item === "string" && item.startsWith("http")) {
                    const a = document.createElement("a");
                    a.href = item;
                    a.target = "_blank";
                    a.rel = "noopener noreferrer";
                    a.innerText = item;
                    li.appendChild(a);
                } else {
                    li.innerText = item;
                }

                list.appendChild(li);
            });
        }

        async function send() {
            const q = document.getElementById("q").value.trim();
            if (!q) return;

            const loading = document.getElementById("loading");
            const resultCard = document.getElementById("resultCard");
            loading.classList.remove("d-none");
            resultCard.classList.add("d-none");

            try {
                const res = await fetch(`/chat/api/?q=${encodeURIComponent(q)}`);
                const data = await res.json();

                document.getElementById("answer").innerText = data.answer || "";
                renderList("insights", data.key_insights || [], "No key insights returned.");
                renderList("tips", data.tips || [], "No tips returned.");
                renderList("limitations", data.limitations || [], "No limitations returned.");
                renderList("sources", data.sources || [], "No sources returned.", true);

                resultCard.classList.remove("d-none");
            } catch (err) {
                document.getElementById("answer").innerText = `Request failed: ${err}`;
                renderList("insights", [], "No key insights returned.");
                renderList("tips", [], "No tips returned.");
                renderList("limitations", ["The browser request failed."], "No limitations returned.");
                renderList("sources", [], "No sources returned.");
                resultCard.classList.remove("d-none");
            } finally {
                loading.classList.add("d-none");
            }
        }
    </script>
</body>
</html>
